name: Automated Screenshots

# ============================================================
# ADDING A NEW CITY
# ============================================================
# There is nothing to change here anymore. The city list, timezone and
# quiet hours all come from wetterstation's /locations endpoint (T2
# registry). To add a city:
#   1. Add it to wetterstation's locations.json with "trmnl": true
#   2. Add wetterstation/locations/<slug>/config.json
#   3. Add a dashboard route in wetterstation/netlify.toml
#   4. Create a TRMNL private plugin pointing at
#      https://wetterdirect.netlify.app/img/<slug>
# The next dispatch of this workflow picks the new city up automatically.
# ============================================================
#
# Trigger: workflow_dispatch ONLY. There is no `schedule:` block -- that
# was the thing that was broken (GitHub's cron scheduler is best-effort
# and was silently dropping/delaying most runs). An external caller
# (Netlify Scheduled Function, T5) hits the workflow_dispatch API on a
# tight interval instead; workflow_dispatch is picked up near-instantly.
#
# Quiet hours are decided PER CITY, IN ITS OWN TIMEZONE, inside run.js
# (lib/schedule.js) -- not here. A single workflow-level gate cannot
# express that.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this location slug (leave empty to run every TRMNL-enabled city)'
        required: false
        type: string
        default: ''
      depth:
        description: 'Force conversion depth for every city this run (leave empty to use the registry/default). depth=2 requires TRMNL OG firmware >= 1.6.x.'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
        default: ''

permissions:
  contents: read

concurrency:
  group: screenshot
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Resolve pinned Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned Playwright version (package.json), not on
          # hashFiles('screenshot.js') -- that key never changed when
          # Playwright itself was bumped, so a stale browser binary from an
          # older Playwright version could silently keep being reused.
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install ImageMagick
        run: command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Run screenshot pipeline
        env:
          # Passed via env:, never interpolated directly into this `run:`
          # script -- workflow_dispatch inputs and step outputs are
          # attacker-influenceable strings; splicing them into shell text
          # is the classic GitHub Actions script-injection shape.
          ONLY: ${{ inputs.only }}
          DEPTH_OVERRIDE: ${{ inputs.depth }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node run.js
