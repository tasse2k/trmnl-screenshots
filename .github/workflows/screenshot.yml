name: Automated Screenshots

# ============================================================
# ADDING A NEW CITY
# ============================================================
# There is nothing to change here anymore. The city list, timezone and
# quiet hours all come from wetterstation's /locations endpoint (T2
# registry). To add a city:
#   1. Add it to wetterstation's locations.json with "trmnl": true
#   2. Add wetterstation/locations/<slug>/config.json
#   3. Add a dashboard route in wetterstation/netlify.toml
#   4. Create a TRMNL private plugin pointing at
#      https://wetterdirect.netlify.app/img/<slug>
# The next dispatch of this workflow picks the new city up automatically.
# ============================================================
#
# Trigger: workflow_dispatch ONLY. There is no `schedule:` block -- that
# was the thing that was broken (GitHub's cron scheduler is best-effort
# and was silently dropping/delaying most runs). An external caller
# (Netlify Scheduled Function, T5) hits the workflow_dispatch API on a
# tight interval instead; workflow_dispatch is picked up near-instantly.
#
# The publish cadence is decided PER CITY, IN ITS OWN TIMEZONE, inside run.js
# (lib/schedule.js) -- not here. The dispatch is every 5 minutes; each city
# publishes every 5, 10, 15 or 60 minutes depending on its local hour and its
# quiet window. plan.js makes that decision first, with the same code, and a
# tick no city is due on skips every install and finishes in a few seconds.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run only this location slug (leave empty to run every TRMNL-enabled city)'
        required: false
        type: string
        default: ''
      depth:
        description: 'Force conversion depth for every city this run (leave empty to use the registry/default). depth=2 requires TRMNL OG firmware >= 1.6.x.'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
        default: ''

permissions:
  contents: read

# A newer screenshot supersedes an older one. The image is a snapshot of
# "now", so a run still in flight when the next tick fires is already
# producing a stale frame -- cancelling it loses nothing, and the next run
# writes a fresher image a minute later.
#
# This creates NO extra runs. The cadence is 288 dispatches a day either way;
# this only decides what happens to one that is still going when the next
# arrives. In normal operation nothing is ever cancelled -- a run takes ~50s
# against a 5-minute tick, the package installs are bounded to under four
# minutes (see the install steps), and screenshot.js is bounded at 150s -- so
# a cancellation only ever means "that run was already broken". Before the
# installs were bounded, a slow Ubuntu mirror got 25 runs cancelled in the
# week of 2026-11-14. If runner startup ever grows, shorten those budgets
# rather than slowing the tick.
#
# It is not a timeout dressed up, and it does not hide a hang. With `false`,
# run #14083 wedged and #14084 queued behind it and wedged too, and both
# displays sat on a 14-minute-old frame until they were cancelled by hand.
#
# THE TRADE: `false` would block everything behind a stuck run for up to the
# job's timeout. `true` clears a stuck run at the next tick, but if something
# ever wedged EVERY run, they would all be cancelled and nothing would
# complete. That case is not silent any more: this workflow never emails
# (failures here are warnings, see run.js and the README), and the watchdog
# (watchdog.yml) asks the site's /health every hour whether each frame was
# actually published on schedule -- a content check that emails, which is
# what this comment used to say would be needed if the silent case ever bit.
#
# Chosen because self-healing is better for a wall display than a 6-hour
# block, and because the deadlock that caused #14083 is fixed.
concurrency:
  group: screenshot
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    # A run takes under a minute and the next dispatch cancels one that is
    # still going at five. This only matters if dispatches stop arriving:
    # without it a hung run would hold the concurrency group for GitHub's
    # default six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Before any install: is a city due on this tick? See plan.js. Needs only
      # Node and the checkout. Every later step is skipped when the answer is no.
      - name: Plan
        id: plan
        env:
          ONLY: ${{ inputs.only }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node plan.js

      - name: Install dependencies
        if: steps.plan.outputs.due == 'true'
        run: npm ci

      - name: Resolve pinned Playwright version
        if: steps.plan.outputs.due == 'true'
        id: pw
        run: |
          echo "version=$(node -p "require('./package.json').dependencies.playwright")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.plan.outputs.due == 'true'
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned Playwright version (package.json), not on
          # hashFiles('screenshot.js') -- that key never changed when
          # Playwright itself was bumped, so a stale browser binary from an
          # older Playwright version could silently keep being reused.
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
          restore-keys: ${{ runner.os }}-playwright-

      # Both installs below download from the Ubuntu mirror, and a slow mirror
      # is what hung 90 runs in one week (37 in a row on 2026-11-11). Give up
      # on a stalled download quickly and retry it, instead of waiting on it
      # until the next dispatch cancels the run.
      - name: Make apt give up on a stalled mirror
        if: steps.plan.outputs.due == 'true'
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-meteoframe-timeouts >/dev/null

      # The Ubuntu mirror is the one thing here that fails on its own, and it
      # does so for minutes at a time. Each attempt is bounded, so the whole
      # step is over in under four minutes -- before the next dispatch would
      # cancel the run. If every attempt fails, this tick is skipped: the step
      # still succeeds, the last image stays on the frame, and nothing emails.
      # A mirror outage long enough to leave a frame stale is what the
      # watchdog (/health) is for.
      - name: Install Playwright browser (chromium)
        id: chromium
        if: steps.plan.outputs.due == 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout 70 npx playwright install --with-deps chromium; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt failed"
            # A killed apt can leave dpkg half-way; finish it before retrying.
            sudo dpkg --configure -a || true
            sleep 5
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Could not install Chromium's packages from the Ubuntu mirror in 3 attempts. Skipping this tick; the last image stays up."

      # The step above has just refreshed the package lists, so install
      # straight away and only refresh again if that fails. No recommended
      # packages: they are Ghostscript and PostScript fonts (about 20 MB,
      # including the 10.9 MB download that stalled on 2026-11-10), and a
      # PNG-to-PNG conversion uses none of them.
      - name: Install ImageMagick
        id: imagemagick
        if: steps.plan.outputs.due == 'true' && steps.chromium.outputs.ok == 'true'
        run: |
          if command -v convert >/dev/null; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for attempt in 1 2; do
            if timeout 60 sudo apt-get install -y --no-install-recommends imagemagick \
              || (timeout 60 sudo apt-get update && timeout 60 sudo apt-get install -y --no-install-recommends imagemagick); then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sudo dpkg --configure -a || true
            sleep 5
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Could not install ImageMagick from the Ubuntu mirror. Skipping this tick; the last image stays up."

      - name: Run screenshot pipeline
        if: steps.plan.outputs.due == 'true' && steps.imagemagick.outputs.ok == 'true'
        env:
          PLAN_NOW: ${{ steps.plan.outputs.now }}
          # Passed via env:, never interpolated directly into this `run:`
          # script -- workflow_dispatch inputs and step outputs are
          # attacker-influenceable strings; splicing them into shell text
          # is the classic GitHub Actions script-injection shape.
          ONLY: ${{ inputs.only }}
          DEPTH_OVERRIDE: ${{ inputs.depth }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node run.js
